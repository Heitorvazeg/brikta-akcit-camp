[project]
name = "brikta-ia"
version = "0.1.0"
description = "Serviço de orquestração de IA do Brikta: RDO por voz e Assistente de Obra"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "httpx>=0.27",
    "openai>=1.50",
    "pyjwt>=2.9",
]

# Dependências que entram nas fases seguintes do plano (docs/PLANO_DE_IMPLEMENTACAO.md):
#   IA-F1: rapidfuzz (pós-processamento), SDKs de STT (openai, deepgram-sdk)
#   IA-F2: SDKs de LLM (anthropic, google-genai, openai)
#   IA-F3: sqlalchemy[asyncio], asyncpg, alembic, procrastinate
#   IA-F4: sentry-sdk, langfuse, opentelemetry-*
#   IA-F6: pgvector

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brikta_ia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Blocos de código dentro da documentação são ilustrativos; não formatar/lintar.
extend-exclude = ["docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ASYNC", "RUF"]
ignore = [
    "RUF001", # textos em português usam caracteres como "–" e "·"
    "RUF002",
    "RUF003",
    "N818",   # exceções com nomes em português (Erro*, AcessoNegado)
]

[tool.ruff.lint.isort]
known-first-party = ["brikta_ia", "scripts"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/brikta_ia/domain", "src/brikta_ia/integrations"]
venvPath = "."
venv = ".venv"
